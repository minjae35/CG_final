# PRD v2 §3 + T4 smoke options
scene:
  dataset_url: "http://storage.googleapis.com/gresearch/refraw360/360_v2.zip"
  data_root: "data/mipnerf360"
  scene_name: "room"
  model_output: "output/base_scene_smoke"
  training_iterations: 30000
  training_iterations_low: 8000  # smoke / T4-friendly

reconstruction:
  render_width: 640
  render_height: 480
  render_view_stride: 10

segmentation:
  grounding_dino_checkpoint: "submodules/Grounded-SAM-2/gdino_checkpoints/groundingdino_swinb_cogcoor.pth"
  grounding_dino_config: "submodules/Grounded-SAM-2/grounding_dino/groundingdino/config/GroundingDINO_SwinB_cfg.py"
  sam2_checkpoint: "submodules/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt"
  sam2_config: "submodules/Grounded-SAM-2/sam2/configs/sam2.1/sam2.1_hiera_l.yaml"
  box_threshold: 0.3
  text_threshold: 0.25
  multi_view_count: 4
  consensus_min_votes: 2
  inference_width: 640
  inference_height: 480
  segmentation_device: cuda
  mask_stride: 2
  mask_3d_distance_threshold_m: 0.07
  mask_use_depth_consistency: true
  mask_depth_tolerance_abs_m: 0.035
  mask_depth_tolerance_rel: 0.03
  mask_knn: 12
  mask_pixel_tolerance_px: 5.0
  mask_min_votes: 2
  mask_erode_iters: 0
  mode_b_expand_bbox_margin_ratio: 0.06
  mode_b_expand_bbox_z_margin_ratio: 0.10

generation:
  stable_diffusion_model: "runwayml/stable-diffusion-v1-5"
  sds_steps: 200         # placement / physics 검증용 임시값. 형상 품질 만족시 1000+로 다시 올린다.
  sds_steps_low: 200
  guidance_scale: 100.0
  object_scale_factor: 0.016  # slightly larger duck footprint on the rug.

placement:
  surface_search_radius: 0.5
  opacity_threshold: 0.5

mode_b_presets:
  desk_jelly:
    selection_prompt: "wooden desk in the forefront"
    physics_type: "jelly"
    output_subdir: "mode_b_jelly"
    physics_overrides: {}
  footrest_sand:
    selection_prompt: "blue armchair in the back center"
    physics_type: "sand"
    output_subdir: "mode_b_sand"
    physics_overrides:
      # Sand tends to explode under strong jelly wobble BCs; disable in-place shear wobble by default.
      mode_b_mpm_in_place_shear_wobble: false
      mode_b_phys_sustained_wobble: false
      mode_b_render_freeze_gaussian_cov: true

physics:
  n_grid: 100
  n_grid_low: 40       # used with mode-b --smoke (MPM grid); lower = less Taichi/Warp VRAM
  substep_dt: 0.0002    # smaller = stabler MPM on T4 with stiff rubber / many splats
  frame_dt: 0.01
  frame_num: 200       # shorter sim = less long-run creep / spread on the rug
  frame_num_test: 30   # kinematic --smoke length (~1 s)
  taichi_device_memory_gb: 4.0   # PhysGaussian ti.init arena; T4 often 4–5
  mode_b_mpm_smoke_frames: 48   # mode-b MPM frame count when --smoke (not kinematic)
  gravity: -9.8
  gravity_scale: 0.62  # gentler collapse while still in floor contact (rubber toy)
  floor_friction: 0.40 # lower tangential stick that can shear/spread jelly-like material
  sim_area_margin: 0.38
  wobble_velocity: 0.058
  wobble_end_time: 0.075
  placement_floor_contact_y_eps: 0.0  # add tiny +y only if you need MPM epsilon (usually 0)
  enable_mpm_particle_filling: false
  compile_video_playback_sec: 5.0
  # mode-a + jelly MPM: softer + less grid damping → more jiggle on floor contact (mode-b unchanged)
  mode_a_jelly_E: 48000
  mode_a_jelly_grid_v_damping_scale: 0.99988
  # mode-b: jelly stays on the *selected* object's support (high-Y percentile) + COM pin in PhysGaussian.
  mode_b_support_contact_percentile: 92.0
  mode_b_pin_initial_com: true
  mode_b_pin_com_vertical_only: false
  # Zero bulk velocity on visual Gaussians each frame — damp slow horizontal creep / bias after shear pulse.
  mode_b_pin_zero_mean_velocity_gs: true
  mode_b_mpm_in_place_shear_wobble: true
  mode_b_jelly_gravity_mult: 0.24
  mode_b_jelly_E: 200000
  mode_b_jelly_grid_v_damping_scale: 0.99990
  # Stronger / longer symmetric shear; full-height slabs (mode_b_shear_wobble_full_volume) excite legs too.
  mode_b_shear_wobble_velocity: 0.12
  mode_b_shear_wobble_end_time: 0.18
  mode_b_shear_wobble_full_volume: true
  # MPM Dirichlet: sinusoidal shear for full physics duration (see mode_b_phys_*). Not render-time.
  mode_b_phys_sustained_wobble: true
  mode_b_phys_wobble_frequency_hz: 1.35
  mode_b_phys_wobble_velocity_peak: 0.2
  mode_b_phys_wobble_velocity_peak_x: null
  mode_b_phys_wobble_velocity_peak_y: 0.14
  # π/2: vertical lags horizontal.
  mode_b_phys_wobble_phase_y: 1.5708
  mode_b_phys_wobble_band_amp_x: [1.1, 1.0, 0.95]
  mode_b_phys_wobble_band_amp_y: [1.05, 0.65, 0.55]
  mode_b_phys_wobble_band_vy_polarity: [1.0, 0.4, -0.88]
  mode_b_phys_wobble_band_phase_y_offset_rad: [0.0, 0.14, -0.11]
  # Z = depth (MDN space); diagonals in XZ; twist = position-dependent ω_y field.
  mode_b_phys_wobble_velocity_peak_z: 0.12
  mode_b_phys_wobble_velocity_peak_diag1: 0.14
  mode_b_phys_wobble_velocity_peak_diag2: 0.14
  mode_b_phys_wobble_velocity_peak_twist: 0.18
  mode_b_phys_wobble_phase_z: 0.42
  mode_b_phys_wobble_phase_diag1_rad: 0.78
  mode_b_phys_wobble_phase_diag2_rad: 2.35
  mode_b_phys_wobble_phase_twist_rad: 1.05
  mode_b_phys_wobble_bundle_quad_phase_rad: [0.0, 0.55, 1.12, 1.7]
  mode_b_phys_wobble_bundle_band_phase_rad: [0.0, 0.22, -0.16]
  mode_b_phys_wobble_band_amp_z: [1.05, 0.95, 0.88]
  mode_b_phys_wobble_band_amp_diag1: [1.05, 0.95, 0.9]
  mode_b_phys_wobble_band_amp_diag2: [1.05, 0.95, 0.9]
  mode_b_phys_wobble_band_amp_twist: [1.1, 1.0, 0.95]
  mode_b_phys_wobble_force_scale: 1.0
  mode_b_phys_wobble_decay_lambda_per_s: 0.0
  mode_b_phys_wobble_duration_s: null
  mode_b_phys_wobble_ramp_time_s: 0.45
  # Simulated seconds of MPM (pipeline extends frame_num to cover this when sustained is on; null = compile_video_playback_sec).
  mode_b_phys_wobble_motion_seconds: null
  mode_b_sim_area_margin: 0.2
  mode_b_mpm_displacement_retention: 0.86
  mode_b_render_freeze_gaussian_cov: true
  # Off: Kabsch strip removes rigid motion each frame and hides whole-table in-place wobble (COM pin fights lean).
  mode_b_mpm_kabsch_rigid_strip: false
  mode_b_mpm_kabsch_elastic_amp: 1.0
  # Fewer foot Gaussians locked → legs participate in jelly motion.
  mode_b_mpm_anchor_feet_y_percentile: 92.0
  mode_b_mpm_shear_symmetric_lr_split: true
  mode_b_mpm_tilt_diagnostics: true
  mode_b_mpm_tilt_top_y_percentile: 32.0

evaluation:
  test_views: [0, 5, 10, 15, 20]
  lpips_net: "alex"

paths:
  merged_output: "output/merged_scenes"
  sim_output: "output/sim_results"
  generated_objects: "output/generated_objects"
  eval_output: "output/eval"
